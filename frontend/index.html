<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Book My Show</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#d2232a"><script>try{
// Poster pre-download: start fetching posters before the app code has even loaded. First from the saved copy of the
// movie list (repeat visits: posters begin downloading instantly), then again from the fresh list. Same w342 size
// the app asks for, so the browser reuses these downloads.
(function(){var seen={};function warm(list){try{if(!Array.isArray(list))return;var n=0;for(var i=0;i<list.length&&n<16;i++){var m=list[i];if(!m||m.language!=="Telugu"||!m.poster_url)continue;var u=String(m.poster_url).replace(/(image\.tmdb\.org\/t\/p\/)(w500|w780|original)\//,"$1w342/");n++;if(seen[u])continue;seen[u]=1;var im=new Image();im.decoding="async";im.src=u}}catch(e){}}
try{warm(JSON.parse(localStorage.getItem("bms_swr_/movies")||"null"))}catch(e){}
window.__bmsWarmPosters=warm})();
window.__bmsMovies=fetch("https://book-my-show-api-qx31.onrender.com/api/movies").then(function(r){return r.ok?r.json():null}).then(function(d){try{window.__bmsWarmPosters(d)}catch(e){}return d}).catch(function(){return null})}catch(e){}</script>
<link rel="preconnect" href="https://image.tmdb.org" crossorigin>
<link rel="dns-prefetch" href="https://image.tmdb.org"><link rel="preconnect" href="https://book-my-show-api-qx31.onrender.com" crossorigin><link rel="dns-prefetch" href="https://book-my-show-api-qx31.onrender.com"><script>try{if(localStorage.getItem("bms_theme")==="dark")document.documentElement.dataset.theme="dark";document.querySelector('meta[name=theme-color]').setAttribute("content","#121216")}catch(e){}</script>
</head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
