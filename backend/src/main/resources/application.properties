server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bookmyshow}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.sql.init.mode=always
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-123456789}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}
razorpay.key=${RAZORPAY_KEY_ID:}
razorpay.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM_EMAIL:onboarding@resend.dev}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
# Speed: gzip JSON responses, keep connections alive, small pool tuned for the free tier.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
server.compression.min-response-size=1024
server.tomcat.keep-alive-timeout=30000
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2

# Movie database (TMDB) used to auto-fill poster, language, genre, cast and crew, release date from a movie name.
# Free key: themoviedb.org -> Settings -> API. Either the "API Key" or the "API Read Access Token" works.
tmdb.key=${TMDB_API_KEY:}
