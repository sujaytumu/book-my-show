name: keepalive
# Render's free tier sleeps after ~15 minutes idle (first open then takes a minute or more).
# GitHub's scheduled runs are often delayed by hours, so a single ping every 5 minutes is not reliable.
# Instead one run stays alive for ~5h50m and pings every 4 minutes; the next scheduled run waits in the
# queue (concurrency) and takes over as soon as this one ends, so the API stays awake around the clock.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  actions: write
concurrency:
  group: keepalive
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping every 4 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          end=$((SECONDS + 350*60))
          handoff=$((SECONDS + 330*60))
          queued=0
          while [ $SECONDS -lt $end ]; do
            # 20 minutes before this run ends, queue the next one so there is never a gap
            if [ $queued -eq 0 ] && [ $SECONDS -ge $handoff ]; then
              gh workflow run keepalive.yml --ref main && queued=1 || true
            fi
            curl -sS --max-time 90 -o /dev/null -w "health %{http_code} %{time_total}s\n" https://book-my-show-api-qx31.onrender.com/api/health || true
            curl -sS --max-time 90 -o /dev/null https://book-my-show-api-qx31.onrender.com/api/movies || true
            sleep 240
          done
