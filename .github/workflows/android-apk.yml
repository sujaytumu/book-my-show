name: android-apk
on:
  workflow_dispatch:
  push:
    branches: [feature/android-apk]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Build web app
        env:
          # Optional override: repo variable VITE_API_URL. Defaults to the Render API below.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://book-my-show-api-qx31.onrender.com/api' }}
        run: |
          npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: book-my-show-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
