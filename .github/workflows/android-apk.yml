name: android-apk
on:
  workflow_dispatch:
  push:
    branches: [feature/android-apk]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Build web app
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://book-my-show-api-qx31.onrender.com/api' }}
          VITE_BUILD_ID: ${{ github.run_number }}
        run: npm run build
      - run: npx cap sync android
      - name: Load permanent signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KSPW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/bms.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/bms.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KSPW" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: APK is signed with a random key, so it will NOT install over a previous build."
          fi
      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -n -i -E "what went wrong|error:|exception|not found|failed|license|sdk" build.log | head -25 | sed 's/%/%25/g' | tr '\n' '|')
            echo "::error title=Gradle failed::$msg"
            tail -40 build.log
          fi
          exit $code
      - name: Bundle web build for in-app updates
        run: |
          cd dist && zip -qr ../bundle.zip . && cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk book-my-show.apk
          NATIVE=$(grep -oP 'NATIVE_VERSION = \K[0-9]+' src/appVersion.js)
          echo "{\"build\":\"${{ github.run_number }}\",\"native\":$NATIVE}" > release-body.json
          cat release-body.json
      - name: Publish release (APK + update bundle)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-latest book-my-show.apk bundle.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Latest Android APK" --notes-file release-body.json
