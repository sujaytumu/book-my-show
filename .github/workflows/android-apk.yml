name: android-apk
on:
  workflow_dispatch:
  push:
    branches: [feature/android-apk]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Build web app
        env:
          # Optional override: repo variable VITE_API_URL. Defaults to the Render API below.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://book-my-show-api-qx31.onrender.com/api' }}
        run: |
          npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -n -i -E "what went wrong|error:|exception|not found|failed|license|sdk" build.log | head -25 | sed 's/%/%25/g' | tr '\n' '|')
            echo "::error title=Gradle failed::$msg"
            tail -40 build.log
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: book-my-show-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to a public download link (GitHub Release)
        working-directory: frontend/android/app/build/outputs/apk/debug
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-debug.apk book-my-show.apk
          gh release delete apk-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-latest book-my-show.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Latest Android APK" --notes "Debug APK built from commit $GITHUB_SHA"
